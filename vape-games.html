<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vape Games</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0a0d;color:#f5f5f7;font-family:Arial,sans-serif}.wrap{max-width:1170px;margin:auto;padding:7vh 34px}h1{margin:0;font-size:clamp(48px,8vw,82px);letter-spacing:-5px}.sub{margin:14px 0 26px;color:#aaa4b4}.tools{margin:0 0 28px}.search{width:min(400px,100%);padding:12px 14px;border:1px solid #3b3445;border-radius:9px;outline:0;background:#15151a;color:#fff;font:14px Arial,sans-serif}.count{padding:12px 0;color:#8c8498;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:11px}.game{position:relative;isolation:isolate;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;padding:17px;overflow:hidden;border:1px solid #302d37;border-radius:15px;background:#19171d;color:#fff;text-decoration:none;transition:.16s transform,.16s border-color}.game:before{position:absolute;z-index:-2;inset:0;background:var(--cover) center/cover no-repeat;content:""}.game:after{position:absolute;z-index:-1;inset:0;background:linear-gradient(0deg,rgba(8,8,11,.96),rgba(8,8,11,.08));content:""}.game:hover{transform:translateY(-3px);border-color:#bf98ef}.source{margin-bottom:7px;color:#e1cff8;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}.game strong{font-size:17px;letter-spacing:-.3px}.foot{margin:30px 0;color:#76707e;font-size:12px;line-height:1.45}</style></head><body><main class="wrap"><h1>Vape Games</h1><p class="sub">58 local browser games. Search, click, play.</p><div class="tools"><input class="search" id="search" autocomplete="off" placeholder="Search games"></div><div class="count" id="count"></div><section class="grid" id="games"></section><p class="foot">A few older UltraPox titles use Flash and require a browser with Flash support or an emulator.</p></main><script>const u=[['2048','2048/index.html'],['1v1.lol','1v1lol/index.html'],['A Dance of Fire & Ice','adofai/index.html'],['Awesome Tanks','awesometanks/index.html'],['Geometry Dash','geometrydash/index.html'],['Gun Mayhem 2','gunmayhem2/index.html'],['Minesweeper','minesweeper/index.html'],['Paper.io','paperio/index.html'],['Pool','pool/index.html'],['Run 2','run2/index.html'],['Slope','slope/index.html'],['Slope 3','slope3/index.html'],['Vex','vex/index.html'],['Vex 2','vex2/index.html'],['Vex 3','vex3/index.html'],["World's Hardest Game",'worldshardestgame/index.html'],["World's Hardest Game 2",'worldshardestgame2/index.html']].map(x=>[...x,'UltraPox']);const n=['Escape Road','2048 Classic','Hangman','Timed Memory','Stack','OvO','House of Hazards','Minesweeper Classic','Stick Hero','OvO 2','N-Gon','Color Run','Platform Game Engine','Connect 4','Platform Game','Tetris','Cookie Clicker','Platformer','Tic-Tac-Toe 2P','Crossy Road','Polytrack','Tilting Maze','CSGO','Pong','Traffic Run','Deltarune','Lighthouse','Rubiks','Ultrakill','Developer Game','Long Road','Sandboxels','Word Guessing','Drive Mad','Maze','Game Stash','Memory Game Pretty','Snakes & Ladders','Gorillas','Memory Game','Spell Cast'],p=['escape-road','2048','hangman','memory-timed-game','stack','OvO','hazard-house','minesweeper','stick-hero','OvO2','n-gon','color-run','platform-game-engine','connect4','platform-game','tetris','cookie-clicker','platformer','tic-tac-toe-2p','crossy-road','polytrack','tilting-maze','csgo','pong','traffic-run','deltarune','lighthouse','rubiks','ultrakill','developer-game','long-road','sandboxels','word-guessing','drive-mad','maze','game-stash','memory-game-pretty','snakes-and-ladders','gorillas','memory-game','spell-cast'],m=n.map((x,i)=>[x,`more-games/codepen.io/${p[i]}.html`,'Static Collection']),games=[...u,...m],covers={'2048/index.html':'2048/icon.png','1v1lol/index.html':'1v1lol/splash.png','adofai/index.html':'adofai/icon.png','geometrydash/index.html':'geometrydash/icon (10).png','gunmayhem2/index.html':'gunmayhem2/icon (7).png','paperio/index.html':'paperio/icon.png','run2/index.html':'run2/icon.jpg','slope/index.html':'slope/slope4.jpeg','slope3/index.html':'slope3/cover.svg','vex/index.html':'vex/icon (8).png','vex2/index.html':'vex2/icon (6).png','vex3/index.html':'vex3/icon.png','worldshardestgame/index.html':'worldshardestgame/icon (3).png','worldshardestgame2/index.html':'worldshardestgame2/images/the-worlds-hardest-game-2.jpg'},grid=document.getElementById('games'),count=document.getElementById('count');function render(q=''){const x=games.filter(([a])=>a.toLowerCase().includes(q.toLowerCase()));count.textContent=`${x.length} games`;grid.innerHTML=x.map(([a,b,c])=>`<a class="game" style="--cover:url('${covers[b]?'vape-games/'+covers[b]:''}')" href="vape-games/${b}"><span class="source">${c}</span><strong>${a}</strong></a>`).join('')}document.getElementById('search').oninput=e=>render(e.target.value);render();</script></body></html>
