<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision</title><style>html,body{height:100%;margin:0;background:#0b0b0d;color:#f2f2f4;font-family:Arial,sans-serif}.wrap{min-height:100%;display:grid;place-items:center;padding:28px}.card{max-width:540px;width:100%;padding:34px;border:1px solid #292930;border-radius:18px;background:#141419;box-shadow:0 20px 70px #0007}h1{margin:0 0 10px;font-size:44px;letter-spacing:-2px}p{color:#a7a7b1;line-height:1.55}form{display:flex;gap:9px;margin-top:25px}input{min-width:0;flex:1;padding:13px;border:1px solid #34343c;border-radius:9px;background:#0a0a0d;color:#fff;font:14px Arial,sans-serif}button{border:0;border-radius:9px;padding:0 18px;background:#fff;color:#111;font-weight:800;cursor:pointer}.note{margin-top:18px;font-size:12px;color:#70707b}</style></head><body><main class="wrap"><section class="card"><h1>Revision</h1><p>Revision is the alternate proxy. It requires its own hosted ScramJet/WISP server, so it cannot run from this standalone HTML file alone.</p><form id="form"><input id="endpoint" type="url" placeholder="https://your-revision-server.example"><button>Open</button></form><p class="note">The cloned Revision source is included in <code>revision-source</code>. Start or deploy it there, then paste its address here.</p></section></main><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const url=document.getElementById('endpoint').value.trim();if(url)location.href=url;});</script></body></html>
