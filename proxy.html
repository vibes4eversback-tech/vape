<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proxy</title><style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#0a0a0d;color:#f4f4f6;font-family:Arial,sans-serif}.wrap{min-height:100%;display:grid;place-items:center;padding:30px}.card{width:min(590px,100%);padding:34px;border:1px solid #2a2a32;border-radius:18px;background:#141419;box-shadow:0 20px 80px #0008}.eyebrow{color:#888894;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}h1{margin:9px 0;font-size:44px;letter-spacing:-2px}p{color:#a4a4ae;line-height:1.55}form{display:flex;gap:9px;margin-top:25px}input{flex:1;min-width:0;padding:13px;border:1px solid #363640;border-radius:9px;background:#0a0a0d;color:#fff;font:14px Arial,sans-serif}button{border:0;border-radius:9px;padding:0 19px;background:#fff;color:#09090b;font-weight:800;cursor:pointer}.note{margin-top:20px;color:#70707b;font-size:12px}.source{color:#b7b7c0;font-family:monospace}</style></head><body><main class="wrap"><section class="card"><div class="eyebrow">Alternate Proxy</div><h1 id="name">Proxy</h1><p>Enter the URL where you hosted this engine. These engines depend on a service worker and/or server relay, so they cannot become functional just by opening a static file.</p><form id="form"><input id="endpoint" type="url" placeholder="https://your-hosted-endpoint.example"><button>Open</button></form><p class="note">Bundled source: <span class="source" id="source"></span></p></section></main><script>const p=new URLSearchParams(location.search),name=p.get('name')||'Proxy',source=p.get('source')||'';document.title=name;document.getElementById('name').textContent=name;document.getElementById('source').textContent=source;document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('endpoint').value.trim();if(u)location.href=u});</script></body></html>
